  <body>

    <div id="root"></div>
    <div id="loader">
      <div class="loader-container">
        <div class="loader-spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
    <script>
      window.addEventListener('load', function() {
        var loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            loader.style.display = 'none';
          }, 500);
        }
      });
    </script>
